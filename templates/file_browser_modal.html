<!-- File Browser Modal -->
<div class="modal fade" id="fileBrowserModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title">File Browser</h5>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="input-group mb-3">
            <button class="btn btn-outline-secondary" id="browserUpBtn" type="button"><i class="bi bi-arrow-up"></i> Up</button>
            <input type="text" class="form-control" id="browserCurrentPath" readonly>
        </div>
        <div id="browserError" class="alert alert-danger d-none"></div>
        <div class="list-group" id="browserList" style="max-height: 400px; overflow-y: auto;">
            <!-- Populated by JS -->
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary" id="browserSelectBtn">Select Current Directory</button>
      </div>
    </div>
  </div>
</div>
