<!DOCTYPE html>
<html lang="en" data-bs-theme="{{ settings.theme | default('light') }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login &bull; Service Manager</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='img/favicon.svg') }}">
    <link rel="alternate icon" href="{{ url_for('static', filename='favicon.ico') }}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: var(--bs-body-bg);
        }
        .login-card {
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--bs-card-bg);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-11 col-sm-8 col-md-5 col-lg-4">
                <div class="card login-card shadow-sm p-4">
                    <div class="text-center mb-4">
                        <img src="{{ url_for('static', filename='img/logo.svg') }}" alt="Logo" width="48" height="48" class="mb-2">
                        <h4 class="fw-bold mb-0">Service<span class="text-primary">Manager</span></h4>
                        <span class="text-secondary small">Manage system services & Docker containers</span>
                    </div>
                    {% with messages = get_flashed_messages(with_categories=true) %}
                        {% if messages %}
                            {% for category, message in messages %}
                                <div class="alert alert-{{ category }} rounded-3 py-2 small">{{ message }}</div>
                            {% endfor %}
                        {% endif %}
                    {% endwith %}
                    <form method="POST">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Manager Password</label>
                            <input type="password" name="password" class="form-control" required autofocus placeholder="Enter password">
                        </div>
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-medium mb-3">
                            <i class="bi bi-shield-lock me-1"></i> Unlock as Admin
                        </button>
                    </form>

                    <div class="position-relative text-center my-3">
                        <hr class="text-secondary opacity-25">
                        <span class="position-absolute top-50 start-50 translate-middle bg-body px-2 text-secondary small" style="font-size: 0.75rem;">OR</span>
                    </div>

                    <a href="{{ url_for('guest_login') }}" class="btn btn-outline-secondary w-100 py-2 fw-medium d-flex align-items-center justify-content-center gap-1.5">
                        <i class="bi bi-eye"></i> Continue in Guest Mode (Read-Only)
                    </a>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
