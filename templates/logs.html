{% extends 'base.html' %}
{% block content %}
<div class="card shadow-sm mb-4">
    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
        <h5 class="mb-0">Logs: {{ name }}</h5>
        <div>
            <a href="{{ url_for('dashboard') }}" class="btn btn-sm btn-outline-light">Back</a>
            <button id="downloadLogs" class="btn btn-sm btn-light ms-2"><i class="bi bi-download"></i> Download</button>
        </div>
    </div>
    <div class="card-body bg-black text-light p-0">
        <pre id="logContainer" class="p-3 mb-0" style="height: 60vh; overflow-y: scroll; font-family: monospace; font-size: 0.9em; white-space: pre-wrap;"></pre>
    </div>
</div>

<script>
    const serviceName = "{{ name }}";
    const logContainer = document.getElementById('logContainer');
    
    function fetchLogs() {
        fetch(`/api/logs/${serviceName}?lines=100`)
            .then(response => response.json())
            .then(data => {
                logContainer.textContent = data.logs || "No logs found or unable to fetch logs.";
                // Auto scroll to bottom
                logContainer.scrollTop = logContainer.scrollHeight;
            })
            .catch(err => {
                logContainer.textContent = "Error fetching logs: " + err;
            });
    }

    // Fetch initially and then every 5 seconds when visible
    fetchLogs();
    const intervalId = setInterval(() => {
        if (!document.hidden) {
            fetchLogs();
        }
    }, 5000);

    // Download logs
    document.getElementById('downloadLogs').addEventListener('click', () => {
        const text = logContainer.textContent;
        const blob = new Blob([text], { type: 'text/plain' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `${serviceName}_logs.txt`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);
    });
</script>
{% endblock %}
